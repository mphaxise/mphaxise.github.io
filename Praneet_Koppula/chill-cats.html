<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK's Daily Cat Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6ee; 
  --fg: #201914; 
  --fg-2: #4c4037;
  --muted: #7a6d63; 
  --accent: #9b5b32;
  --success: #4caf50;
  --error: #f44336;
  --border: #e8ddd0;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--fg);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:#fff}

.container{max-width:640px;margin:0 auto;padding:0 24px 80px}
img{max-width:100%;display:block;border-radius:12px;transition:transform 0.2s}
img:hover{transform:scale(1.05)}

.game-header{text-align:center;margin-bottom:32px;padding:20px;background:rgba(255,255,255,0.8);border-radius:16px}
.game-title{font-family:var(--font-display);font-size:2.5rem;margin-bottom:8px;color:var(--fg)}
.game-subtitle{font-family:var(--font-body);font-size:1.1rem;color:var(--muted)}

.game-status{display:flex;justify-content:space-around;margin:20px 0;padding:16px;background:rgba(255,255,255,0.9);border-radius:12px}
.status-item{text-align:center}
.status-label{font-size:0.9rem;color:var(--muted);margin-bottom:4px}
.status-value{font-family:var(--font-display);font-size:1.8rem;font-weight:bold}
.streak-value{color:var(--accent)}
.score-value{color:var(--fg)}

.cats-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:16px;margin:24px 0}
.cat-card{position:relative;cursor:pointer;transition:transform 0.2s}
.cat-card:hover{transform:translateY(-4px)}
.cat-image{width:100%;height:120px;object-fit:cover;border-radius:12px}
.cat-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;border-radius:12px}
.cat-card:hover .cat-overlay{opacity:1}
.cat-overlay span{color:white;font-weight:bold;font-size:1.1rem}

.guess-section{margin:32px 0;padding:24px;background:rgba(255,255,255,0.9);border-radius:16px}
.guess-input{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.guess-input input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:1.1rem;outline:none}
.guess-input input:focus{border-color:var(--accent)}
.guess-input button{padding:12px 24px;background:var(--accent);color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:background 0.2s}
.guess-input button:hover{background:#8a4a28}

.feedback{margin-top:16px;padding:16px;border-radius:12px;text-align:center;font-weight:bold;display:none}
.feedback.correct{background:#e8f5e9;color:var(--success);border:1px solid var(--success)}
.feedback.incorrect{background:#ffebee;color:var(--error);border:1px solid var(--error)}

.secret-section{margin-top:24px;padding:20px;background:#fff3e0;border-radius:12px}
.secret-input{display:flex;gap:12px;align-items:center}
.secret-input input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:1.1rem;outline:none}
.secret-input input:focus{border-color:#ff9800}
.secret-input button{padding:12px 24px;background:#ff9800;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:background 0.2s}
.secret-input button:hover{background:#f57c00}

.footer{text-align:center;margin-top:40px;color:var(--muted);font-size:0.9rem}
</style>
</head>
<body>
<div class="container">
  <div class="game-header">
    <h1 class="game-title">🐱 Daily Cat Detective</h1>
    <p class="game-subtitle">Can you spot the AI-generated cats?</p>
  </div>
  
  <div class="game-status">
    <div class="status-item">
      <div class="status-label">Today's Challenge</div>
      <div class="status-value" id="daily-target">?</div>
    </div>
    <div class="status-item">
      <div class="status-label">Your Streak</div>
      <div class="status-value streak-value" id="streak-count">0</div>
    </div>
    <div class="status-item">
      <div class="status-label">Your Score</div>
      <div class="status-value score-value" id="score-count">0</div>
    </div>
  </div>
  
  <div class="cats-grid" id="cats-grid">
    <!-- Cat images will be populated here by JavaScript -->
  </div>
  
  <div class="guess-section">
    <h2>Make Your Guess</div>
    <div class="guess-input">
      <input type="number" id="guess-input" min="0" max="10" placeholder="How many AI cats? (0-10)" aria-label="Number of AI cats">
      <button id="submit-guess">Submit Guess</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  
  <div class="secret-section">
    <h3>Verify Your Identity</h3>
    <p>To save your progress, please enter the secret word:</p>
    <div class="secret-input">
      <input type="password" id="secret-input" placeholder="Enter secret word" aria-label="Secret word">
      <button id="verify-secret">Verify</button>
    </div>
    <p id="secret-message" style="margin-top:12px; font-size:0.9rem; color:#666;"></p>
  </div>
  
  <div class="footer">
    <p>New challenge loads every day at midnight • Made with ❤️ for MK</p>
  </div>
</div>

<script>
  // Game state
  let gameState = {
    totalCats: 10,
    aiCount: 0,
    userGuess: null,
    isCorrect: false,
    streak: 0,
    totalScore: 0,
    maxPossibleScore: 0,
    lastPlayedDate: null,
    isVerified: false
  };
  
  // Cat image paths (you'll need to populate these with actual paths)
  const realCatImages = [
    "cats/cat1.jpg",
    "cats/cat2.jpg", 
    "cats/cat3.jpg",
    "cats/cat4.jpg",
    "cats/cat5.jpg",
    "cats/cat6.jpg",
    "cats/cat7.jpg",
    "cats/cat8.jpg",
    "cats/cat9.jpg",
    "cats/cat10.jpg"
  ];
  
  const aiCatImages = [
    "cats/ai/cat-ai1.jpg",
    "cats/ai/cat-ai2.jpg",
    "cats/ai/cat-ai3.jpg",
    "cats/ai/cat-ai4.jpg",
    "cats/cat2.jpg",
    "cats/cat4.jpg",
    "cats/cat6.jpg",
    "cats/cat8.jpg",
    "cats/cat9.jpg",
    "cats/cat10.jpg"
  ];
  
  // DOM elements
  const catsGrid = document.getElementById('cats-grid');
  const guessInput = document.getElementById('guess-input');
  const submitGuessBtn = document.getElementById('submit-guess');
  const feedbackEl = document.getElementById('feedback');
  const secretInput = document.getElementById('secret-input');
  const verifySecretBtn = document.getElementById('verify-secret');
  const secretMessageEl = document.getElementById('secret-message');
  const streakCountEl = document.getElementById('streak-count');
  const scoreCountEl = document.getElementById('score-count');
  const dailyTargetEl = document.getElementById('daily-target');
  
  // Initialize game
  function initGame() {
    loadGameState();
    generateDailyChallenge();
    updateDisplay();
    
    // Set up event listeners
    submitGuessBtn.addEventListener('click', handleGuessSubmit);
    guessInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleGuessSubmit();
    });
    
    verifySecretBtn.addEventListener('click', handleSecretVerify);
    secretInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSecretVerify();
    });
  }
  
  // Load game state from localStorage
  function loadGameState() {
    const saved = localStorage.getItem('mkCatGameState');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        // Check if it's from today
        const lastDate = new parsed.lastPlayedDate;
        if (lastDate.toDateString() === new Date().toDateString()) {
          // Same day, restore state
          gameState = parsed;
        } else {
          // New day, reset guess-related state but keep streak/score
          gameState.streak = parsed.streak;
          gameState.totalScore = parsed.totalScore;
          gameState.maxPossibleScore = parsed.maxPossibleScore;
          gameState.lastPlayedDate = new Date().toISOString();
        }
      } catch (e) {
        console.error('Failed to parse game state', e);
        resetGameState();
      }
    } else {
      resetGameState();
    }
  }
  
  // Reset game state for new day or fresh start
  function resetGameState() {
    gameState = {
      totalCats: 10,
      aiCount: 0,
      userGuess: null,
      isCorrect: false,
      streak: 0,
      totalScore: 0,
      maxPossibleScore: 0,
      lastPlayedDate: new Date().toISOString(),
      isVerified: false
    };
    saveGameState();
  }
  
  // Save game state to localStorage
  function saveGameState() {
    localStorage.setItem('mkCatGameState', JSON.stringify(gameState));
  }
  
  // Generate today's challenge (random number of AI cats)
  function generateDailyChallenge() {
    // Seed random based on date so it's the same all day
    const today = new Date();
    const dateKey = today.toDateString();
    const seed = hashString(dateKey);
    
    // Use seeded random to get consistent results for the day
    const random = seededRandom(seed);
    gameState.aiCount = Math.floor(random() * 11); // 0-10 AI cats
    gameState.maxPossibleScore += 1; // One point available per day
    
    saveGameState();
  }
  
  // Simple string hash function for seeding
  function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const char = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash = hash & hash; // Convert to 32bit integer
    }
    return hash;
  }
  
  // Seeded random number generator
  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }
  
  // Get shuffled array of cat images for today
  function getTodaysCats() {
    // Create arrays with the right number of each type
    const realCount = gameState.totalCats - gameState.aiCount;
    const realCats = [...realCatImages].slice(0, realCount);
    const aiCats = [...aiCatImages].slice(0, gameState.aiCount);
    
    // Combine and shuffle
    const allCats = [...realCats, ...aiCats];
    return shuffleArray(allCats);
  }
  
  // Fisher-Yates shuffle algorithm
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }
  
  // Render the cat images
  function renderCats() {
    catsGrid.innerHTML = ''; // Clear existing
    
    const catImages = getTodaysCats();
    
    catImages.forEach((imgSrc, index) => {
      const card = document.createElement('div');
      card.className = 'cat-card';
      card.dataset.index = index;
      card.dataset.isAi = aiCatImages.includes(imgSrc) ? 'true' : 'false';
      
      card.innerHTML = `
        <img src="${imgSrc}" alt="Cat ${index + 1}" class="cat-image">
        <div class="cat-overlay"><span>?</span></div>
      `;
      
      // Add click to reveal if needed (optional)
      card.addEventListener('click', () => {
        // Optional: reveal if it's AI or not after guess
        // For now, just visual feedback
        card.classList.add('selected');
      });
      
      catsGrid.appendChild(card);
    });
  }
  
  // Handle guess submission
  function handleGuessSubmit() {
    const guessValue = parseInt(guessInput.value);
    
    if (isNaN(guessValue) || guessValue < 0 || guessValue > 10) {
      showFeedback('Please enter a number between 0 and 10', false);
      return;
    }
    
    gameState.userGuess = guessValue;
    gameState.isCorrect = (guessValue === gameState.aiCount);
    
    if (gameState.isCorrect) {
      gameState.streak += 1;
      gameState.totalScore += 1;
      showFeedback(`Correct! There were ${gameState.aiCount} AI cats.`, true);
    } else {
      gameState.streak = 0; // Reset streak on wrong answer
      showFeedback(`Sorry! There were ${gameState.aiCount} AI cats, not ${guessValue}.`, false);
    }
    
    // Update display
    updateDisplay();
    saveGameState();
    
    // Reveal which cats were AI after a brief delay
    setTimeout(() => {
      revealAICats();
    }, 1500);
  }
  
  // Show feedback message
  function showFeedback(message, isCorrect) {
    feedbackEl.textContent = message;
    feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
    feedbackEl.style.display = 'block';
    
    // Hide after 3 seconds
    setTimeout(() => {
      feedbackEl.style.display = 'none';
    }, 3000);
  }
  
  // Reveal which cats were AI
  function revealAICats() {
    const catCards = document.querySelectorAll('.cat-card');
    catCards.forEach(card => {
      const isAi = card.dataset.isAi === 'true';
      if (isAi) {
        card.querySelector('.cat-overlay span').textContent = 'AI';
        card.querySelector('.cat-overlay').style.background = 'rgba(76, 175, 80, 0.7)'; // Green for AI
      } else {
        card.querySelector('.cat-overlay span').textContent = 'Real';
        card.querySelector('.cat-overlay').style.background = 'rgba(33, 150, 243, 0.7)'; // Blue for real
      }
    });
  }
  
  // Handle secret word verification
  function handleSecretVerify() {
    const secret = secretInput.value.trim();
    if (secret === 'cutiepie680') {
      gameState.isVerified = true;
      secretMessageEl.textContent = 'Verified! Your progress will be saved.';
      secretMessageEl.style.color = 'var(--success)';
      secretInput.disabled = true;
      verifySecretBtn.disabled = true;
      saveGameState(); // Save after verification
    } else {
      secretMessageEl.textContent = 'Incorrect secret word. Try again.';
      secretMessageEl.style.color = 'var(--error)';
    }
  }
  
  // Update the display with current state
  function updateDisplay() {
    streakCountEl.textContent = gameState.streak;
    scoreCountEl.textContent = `${gameState.totalScore}/${gameState.maxPossibleScore}`;
    dailyTargetEl.textContent = `${gameState.aiCount}/10`; // For reference after guess
    
    // Enable/disable guess input based on verification
    const isVerified = localStorage.getItem('mkCatGameVerified') === 'true' || gameState.isVerified;
    guessInput.disabled = !isVerified;
    submitGuessBtn.disabled = !isVerified;
    
    if (!isVerified) {
      guessInput.placeholder = 'Please verify your identity first';
    } else {
      guessInput.placeholder = 'How many AI cats? (0-10)';
    }
  }
  
  // Check if it's a new day and reset if needed
  function checkForNewDay() {
    const lastPlayed = localStorage.getItem('mkCatGameLastPlayed');
    const today = new Date().toDateString();
    
    if (lastPlayed !== today) {
      // New day - reset guess-related state but keep streak and score
      const streak = parseInt(localStorage.getItem('mkCatGameStreak') || '0');
      const totalScore = parseInt(localStorage.getItem('mkCatGameTotalScore') || '0');
      const maxPossibleScore = parseInt(localStorage.getItem('mkCatGameMaxPossibleScore') || '0');
      
      localStorage.removeItem('mkCatGameState'); // Clear full state
      localStorage.setItem('mkCatGameStreak', String(streak));
      localStorage.setItem('mkCatGameTotalScore', String(totalScore));
      localStorage.setItem('mkCatGameMaxPossibleScore', String(maxPossibleScore));
      localStorage.setItem('mkCatGameLastPlayed', today);
      
      // Reload with new day's challenge
      gameState.lastPlayedDate = new Date().toISOString();
      generateDailyChallenge();
    }
  }
  
  // Initialize when page loads
  document.addEventListener('DOMContentLoaded', () => {
    checkForNewDay();
    initGame();
    
    // Also set up daily reset at midnight (using setTimeout)
    const now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const msToMidnight = midnight - now;
    
    setTimeout(() => {
      // Reload page at midnight to get new day's challenge
      location.reload();
    }, msToMidnight);
  });
</script>
</body>
</html>
