<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline · Praneet Koppula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6ee; --surface: #fffdf8; --fg: #201914; --fg-2: #4c4037;
  --muted: #7a6d63; --accent: #9b5b32; --accent-on: #ffffff;
  --border: #ded2c3; --border-soft: #eee4d7;
  --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'SF Mono', ui-monospace, Menlo, monospace;
  --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --space-10: 40px; --space-12: 48px; --space-16: 64px;
  --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
  --track-color: #c75c2e; --tools-color: #7c6cff; --ai-color: #0891b2;
  --civic-color: #059669; --leadership-color: #d97706;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
::selection{background:var(--accent);color:var(--accent-on)}

/* ─── HEADER ─── */
.header{flex-shrink:0;padding:var(--space-6) var(--space-8) var(--space-3);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.header h1{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-0.01em}
.header .sub{font-size:14px;color:var(--muted)}
.header-controls{display:flex;align-items:center;gap:var(--space-3)}
.header-controls button{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;
  font-size:16px;transition:all .15s ease;font-family:var(--font-body);
}
.header-controls button:hover{border-color:var(--accent);color:var(--accent)}
.header-controls button:active{transform:scale(0.95)}
.header-controls .year-label{font-size:13px;font-weight:600;color:var(--muted);min-width:60px;text-align:center;font-family:var(--font-mono);letter-spacing:0.02em}
@media(max-width:600px){
  .header{padding:var(--space-4) var(--space-4) var(--space-2);flex-wrap:wrap}
  .header h1{font-size:18px}
  .header .sub{font-size:12px}
}

/* ─── TIMELINE TRACK ─── */
.timeline-wrap{flex:1;position:relative;overflow:hidden}
.timeline{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.timeline::-webkit-scrollbar{display:none}
.track{position:relative;height:100%;min-width:3200px;padding:0 48px}
/* 2008-2026 = 19 years, each year ~120px */
.year-line{position:absolute;top:0;bottom:0;width:1px;background:var(--border);pointer-events:none}
.year-line .year-label{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font-mono);white-space:nowrap}

/* ─── DECADE LABELS ─── */
.decade{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-size:120px;font-weight:600;color:var(--border-soft);pointer-events:none;user-select:none;z-index:0;line-height:1;letter-spacing:-0.03em}

/* ─── MILESTONES ─── */
.milestone{position:absolute;z-index:2;cursor:pointer;transition:transform .2s ease,z-index .2s}
.milestone:hover{z-index:10;transform:translateY(-4px)}
.milestone-dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--border);transition:all .2s ease}
.milestone:hover .milestone-dot{box-shadow:0 0 0 3px var(--accent);transform:scale(1.2)}
.milestone-card{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  padding:14px 16px;width:220px;opacity:0;pointer-events:none;
  transition:all .2s ease;box-shadow:0 8px 24px rgba(32,25,20,0.08);z-index:20;
}
.milestone:hover .milestone-card{opacity:1;pointer-events:auto}
.milestone-card .tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.milestone-card .title{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px;color:var(--fg)}
.milestone-card .period{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.milestone-card .desc{font-size:12px;color:var(--fg-2);line-height:1.4;margin-top:6px}
.milestone-card .link{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:var(--accent);text-decoration:none}
.milestone-card .link:hover{text-decoration:underline}

/* Milestones on top half vs bottom half */
.milestone.top .milestone-card{top:auto;bottom:calc(100% + 8px)}
.milestone.top{top:22%}
.milestone.bottom{top:56%}

/* Connector line from dot to card */
.milestone::before{content:'';position:absolute;left:50%;transform:translateX(-50%);width:1.5px;background:var(--border-soft);z-index:-1}
.milestone.top::before{top:14px;height:20px}
.milestone.bottom::before{bottom:14px;height:20px}

/* ─── CENTER LINE ─── */
.center-line{position:absolute;left:0;right:0;top:40%;height:2px;background:linear-gradient(90deg,transparent 0%,var(--border) 5%,var(--border) 95%,transparent 100%);pointer-events:none;z-index:1}

/* ─── MINI CALLOUT ─── */
.callout{position:absolute;top:60%;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);opacity:0;transition:opacity .4s ease;pointer-events:none;z-index:1;text-align:center;font-family:var(--font-mono);letter-spacing:0.04em}
.callout.show{opacity:0.5}

/* ─── TAG LEGEND ─── */
.legend{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%);display:flex;gap:var(--space-3);background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-pill);padding:8px 20px;z-index:100;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:50%}
@media(max-width:600px){.legend{padding:6px 12px;gap:var(--space-2);bottom:var(--space-3)}}

/* ─── AUTOPLAY ─── */
.autoplay-indicator{position:fixed;top:50%;right:32px;transform:translateY(-50%);z-index:50;pointer-events:none;opacity:0;transition:opacity .4s ease}
.autoplay-indicator.show{opacity:0.6}
.autoplay-indicator .arrow{font-size:32px;animation:arrowPulse 1.2s ease-in-out infinite;color:var(--accent)}
@keyframes arrowPulse{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
</style>
</head>
<body>

<header class="header" data-od-id="header">
  <div>
    <h1 data-od-id="heading">Timeline</h1>
    <div class="sub" data-od-id="subheading">18 years of design · scroll or drag to explore</div>
  </div>
  <div class="header-controls">
    <button id="prevBtn" aria-label="Previous">←</button>
    <span class="year-label" id="yearLabel">2008</span>
    <button id="nextBtn" aria-label="Next">→</button>
    <button id="playBtn" aria-label="Auto-play" title="Auto-play">▶</button>
  </div>
</header>

<div class="timeline-wrap">
  <div class="timeline" id="timeline">
    <div class="track" id="track">

      <!-- Year grid (2008–2026) -->
      <div id="yearGrid"></div>

      <!-- Center line -->
      <div class="center-line"></div>

      <!-- Decade labels -->
      <div class="decade" style="left:360px">2000s</div>
      <div class="decade" style="left:1080px">2010s</div>
      <div class="decade" style="left:2280px">2020s</div>

      <!-- Milestones rendered by JS -->
      <div id="milestones"></div>

      <div class="callout" id="callout">← Hover a dot →</div>

    </div>
  </div>
</div>

<div class="legend">
  <span class="legend-item"><span class="legend-dot" style="background:var(--track-color)"></span>Tools</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--ai-color)"></span>AI</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--civic-color)"></span>Civic</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--leadership-color)"></span>Leadership</span>
</div>

<div class="autoplay-indicator" id="autoIndicator"><div class="arrow">→</div></div>

<script>
const MILESTONES = [
  { year:2008, label:'2008–2009', title:'Intel Classmate PC', tag:'Field research', type:'civic', desc:'India classroom research and 18-participant usability study. Authored a 46-page interface concept organized around activity spaces, tags, and a school diary.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/hfi-intel-classmate-pc/' },
  { year:2009, label:'2009', title:'Mobile Money & Financial Inclusion', tag:'Published research', type:'civic', desc:'Co-authored Springer research on mobile money for bottom-of-the-pyramid households in urban India. Published in IDGD 2009 (LNCS 5623).', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/hfi-mobile-money-financial-inclusion/' },
  { year:2010, label:'2010', title:'Urban Wayfinding Research', tag:'Field research', type:'civic', desc:'Planned recruitment, coordinated and moderated fieldwork for Nokia on mobile wayfinding among low-tech users in Indian cities.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/hfi-nokia-urban-wayfinding-research/' },
  { year:2014, label:'2014–2016', title:'Model Slicer', tag:'Technical workflow', type:'tools', desc:'Made early Model Slicer workflow predictable by exposing state, data sources, time intervals, and validity. Authored interaction deck and dynamic-slicing prototypes.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/model-slicer/' },
  { year:2015, label:'2014–2017', title:'Diagnostics & Fix-It', tag:'Interaction design', type:'tools', desc:'Evolved diagnostic surface into a resolution workflow. Evaluated 26 scenarios. Designed controlled transactions to prevent partial model changes.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/diagnostic-viewer-fixit/' },
  { year:2015, label:'2014–2017', title:'Mask Editor', tag:'Technical authoring', type:'tools', desc:'Reimagined block-mask authoring with structured parameters, dialog controls, validation, icons, and reuse. Co-authored Block Authoring Studio vision.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/mask-editor/' },
  { year:2017, label:'2014–2019', title:'Toolstrip Workshops', tag:'Design systems', type:'tools', desc:'Scaled task-based UI design across engineering apps. Authored pattern guidance. Named coach and reviewer in 2019 with a nine-area review checklist.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/toolstrip-workshops/' },
  { year:2020, label:'2020–2023', title:'Workflow Portfolio', tag:'Quality at scale', type:'tools', desc:'Built shared language, prioritization model, ownership process, and advisory mechanism for UX teams to focus on the most impactful workflows.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/workflow-portfolio/' },
  { year:2022, label:'2022–2024', title:'UX Leadership Systems', tag:'Org design', type:'leadership', desc:'Management systems connecting leadership bench, skill gaps, capacity planning, geographic coverage, and development pathways across 4 countries and 120+ products.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/ux-leadership-systems/' },
  { year:2023, label:'2023–2024', title:'AI Assistant for Model-Based Engineering', tag:'AI interaction vision', type:'ai', desc:'Led UX vision for an assistant working across requirements, architecture, simulation, and explanation — with visible, human-controlled actions.', link:'https://mphaxise.github.io/Praneet_Koppula/case-studies/simulink-ai-assistant/' },
  { year:2026, label:'2026', title:'Agent-Callable UX Validation', tag:'AI experiment', type:'ai', desc:'Service model and evidence taxonomy for app-building agents to get trustworthy UX evidence before shipping.', link:'https://mphaxise.github.io/Praneet_Koppula/work/ai-agent-ux-validation.html' },
  { year:2026, label:'2026', title:'Hey Minie Homepage', tag:'Growth design', type:'tools', desc:'Connected acquisition behavior to a focused homepage-improvement program using Plausible analytics and responsive QA.', link:'https://mphaxise.github.io/Praneet_Koppula/work/hey-minie-homepage.html' },
];

const TYPE_COLORS = { tools:'var(--track-color)', ai:'var(--ai-color)', civic:'var(--civic-color)', leadership:'var(--leadership-color)' };
const YEAR_START = 2008;
const YEAR_END = 2026;
const PX_PER_YEAR = 120;
const PADDING = 48;

// ─── BUILD GRID ───
function buildGrid() {
  const grid = document.getElementById('yearGrid');
  for (let y = YEAR_START; y <= YEAR_END; y++) {
    const line = document.createElement('div');
    line.className = 'year-line';
    line.style.left = PX_PER_YEAR * (y - YEAR_START) + PADDING + 'px';
    line.innerHTML = `<span class="year-label">${y}</span>`;
    grid.appendChild(line);
  }
}

// ─── BUILD MILESTONES ───
function buildMilestones() {
  const container = document.getElementById('milestones');
  MILESTONES.forEach((m, i) => {
    const el = document.createElement('div');
    const x = PX_PER_YEAR * (m.year - YEAR_START) + PADDING;
    const side = i % 2 === 0 ? 'top' : 'bottom';
    // Spread nearby milestones vertically
    const sameYear = MILESTONES.filter(o => o.year === m.year);
    const idxInYear = sameYear.indexOf(m);
    const yOffset = sameYear.length > 1 ? idxInYear * 10 : 0;

    el.className = `milestone ${side}`;
    el.style.left = x + 'px';
    el.style.marginTop = yOffset + 'px';
    el.dataset.year = m.year;
    el.innerHTML = `
      <div class="milestone-dot" style="background:${TYPE_COLORS[m.type]};border-color:${TYPE_COLORS[m.type]}"></div>
      <div class="milestone-card">
        <span class="tag" style="color:${TYPE_COLORS[m.type]}">${m.tag}</span>
        <div class="title">${m.title}</div>
        <div class="period">${m.label}</div>
        <div class="desc">${m.desc}</div>
        <a class="link" href="${m.link}" target="_blank" rel="noopener">Read case study →</a>
      </div>
    `;
    container.appendChild(el);
  });
}

// ─── SCROLL POSITION → YEAR LABEL ───
function updateYearLabel() {
  const tl = document.getElementById('timeline');
  const scrollX = tl.scrollLeft;
  const year = YEAR_START + Math.round(scrollX / PX_PER_YEAR);
  const label = document.getElementById('yearLabel');
  label.textContent = Math.max(YEAR_START, Math.min(YEAR_END, year));
}

// ─── NAVIGATION ───
function scrollToYear(year) {
  const tl = document.getElementById('timeline');
  const target = PX_PER_YEAR * (year - YEAR_START) - (window.innerWidth / 2 - PADDING);
  tl.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
}

document.getElementById('prevBtn').addEventListener('click', () => {
  const current = parseInt(document.getElementById('yearLabel').textContent);
  scrollToYear(current - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const current = parseInt(document.getElementById('yearLabel').textContent);
  scrollToYear(current + 1);
});

document.getElementById('timeline').addEventListener('scroll', updateYearLabel);

// ─── AUTOPLAY ───
let autoplayInterval = null;
let autoplayActive = false;
let autoplayYear = YEAR_START;

document.getElementById('playBtn').addEventListener('click', () => {
  const btn = document.getElementById('playBtn');
  const ind = document.getElementById('autoIndicator');
  if (autoplayActive) {
    clearInterval(autoplayInterval);
    autoplayActive = false;
    btn.textContent = '▶';
    ind.classList.remove('show');
    return;
  }
  autoplayActive = true;
  btn.textContent = '⏸';
  ind.classList.add('show');
  autoplayYear = Math.max(YEAR_START, parseInt(document.getElementById('yearLabel').textContent));
  scrollToYear(autoplayYear);
  autoplayInterval = setInterval(() => {
    autoplayYear++;
    if (autoplayYear > YEAR_END) { autoplayYear = YEAR_START; }
    scrollToYear(autoplayYear);
  }, 1800);
});

// ─── KEYBOARD ───
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { document.getElementById('nextBtn').click(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { document.getElementById('prevBtn').click(); e.preventDefault(); }
  else if (e.key === ' ') { document.getElementById('playBtn').click(); e.preventDefault(); }
});

// ─── INIT ───
buildGrid();
buildMilestones();
updateYearLabel();

// Center on latest year initially
setTimeout(() => scrollToYear(2023), 100);

// Show callout briefly
const callout = document.getElementById('callout');
callout.classList.add('show');
setTimeout(() => callout.classList.remove('show'), 4000);
</script>
</body>
</html>
