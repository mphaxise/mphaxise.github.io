<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">My path toward the loop</title>
  <desc id="desc">A pre-AI design loop in 2014 leads into three stages of AI work: an assistant beside engineering work in 2022 and 2023, research becoming system guidance in 2026, and guided physical behavior in simulation next.</desc>
  <defs>
    <marker id="route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#25302d"/></marker>
    <marker id="copper-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a05f48"/></marker>
    <pattern id="sim-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d7d2c7" stroke-width="1"/></pattern>
  </defs>

  <rect width="1280" height="720" fill="#e8e2d7"/>
  <rect x="24" y="20" width="1232" height="680" rx="3" fill="#f8f5ef"/>

  <text x="72" y="60" fill="#435a55" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4">03  /  FIRST-PERSON EVIDENCE JOURNEY</text>
  <text x="72" y="123" fill="#202724" font-family="Iowan Old Style, Baskerville, Palatino Linotype, Georgia, serif" font-size="56" font-weight="500">My path toward the loop</text>
  <line x1="72" y1="158" x2="1208" y2="158" stroke="#cbc5b9"/>

  <!-- Stage zero is a quiet prologue, not a fourth equal panel. -->
  <text x="72" y="192" fill="#a05f48" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">0  /  FALL 2014</text>
  <text x="72" y="229" fill="#202724" font-family="Iowan Old Style, Baskerville, Palatino Linotype, Georgia, serif" font-size="27">Beside the developer</text>
  <text x="325" y="226" fill="#435a55" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13">judgment → code → observation</text>
  <path d="M72 247H204C220 247 226 258 226 273V279C226 288 229 294 236 300" fill="none" stroke="#a05f48" stroke-width="2" marker-end="url(#copper-arrow)"/>

  <!-- The three detailed stages retain the approved V5 visual grammar. -->
  <line x1="236" y1="300" x2="1070" y2="300" stroke="#25302d" stroke-width="1.5" marker-end="url(#route-arrow)"/>
  <circle cx="244" cy="300" r="7" fill="#f8f5ef" stroke="#25302d" stroke-width="2"/>
  <circle cx="640" cy="300" r="7" fill="#435a55"/>
  <circle cx="1046" cy="300" r="7" fill="#f8f5ef" stroke="#a05f48" stroke-width="2"/>

  <text x="72" y="281" fill="#435a55" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">1  /  2022–2023</text>
  <text x="478" y="281" fill="#435a55" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">2  /  2026</text>
  <text x="884" y="281" fill="#a05f48" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">3  /  NEXT</text>

  <g fill="#202724" font-family="Iowan Old Style, Baskerville, Palatino Linotype, Georgia, serif" font-size="28">
    <text x="72" y="351">Assistant beside</text><text x="72" y="384">the work</text>
    <text x="478" y="351">Research becomes</text><text x="478" y="384">guidance</text>
    <text x="884" y="351">Guided behavior</text><text x="884" y="384">in simulation</text>
  </g>

  <rect x="72" y="410" width="324" height="166" fill="#f2efe8"/>
  <g fill="none" stroke="#25302d" stroke-width="1.7">
    <rect x="94" y="426" width="178" height="122"/>
    <rect x="115" y="450" width="42" height="31"/>
    <rect x="207" y="450" width="42" height="31"/>
    <rect x="161" y="510" width="44" height="24"/>
    <path d="M157 465H207M228 481V509M183 481V510"/>
  </g>
  <path d="M281 436H374V511H303L281 531z" fill="none" stroke="#435a55" stroke-width="2"/>
  <g stroke="#435a55" stroke-width="2">
    <line x1="303" y1="459" x2="352" y2="459"/>
    <line x1="303" y1="478" x2="341" y2="478"/>
    <line x1="303" y1="497" x2="348" y2="497"/>
  </g>

  <rect x="478" y="410" width="324" height="166" fill="#f2efe8"/>
  <path d="M504 439H596V487H531L504 506z" fill="none" stroke="#25302d" stroke-width="1.7"/>
  <g stroke="#25302d" stroke-width="1.7">
    <line x1="525" y1="458" x2="576" y2="458"/>
    <line x1="525" y1="474" x2="566" y2="474"/>
  </g>
  <path d="M613 467H659" stroke="#435a55" stroke-width="2"/>
  <path d="M647 459L659 467L647 475" fill="none" stroke="#435a55" stroke-width="2"/>
  <g fill="#f8f5ef" stroke="#25302d" stroke-width="1.5">
    <rect x="682" y="421" width="96" height="35"/>
    <rect x="682" y="466" width="96" height="35"/>
    <rect x="682" y="511" width="96" height="35"/>
  </g>
  <g fill="#435a55">
    <circle cx="699" cy="438" r="3.5"/>
    <circle cx="699" cy="483" r="3.5"/>
    <circle cx="699" cy="528" r="3.5"/>
  </g>

  <rect x="884" y="410" width="324" height="166" fill="url(#sim-grid)" stroke="#d7d2c7"/>
  <circle cx="960" cy="493" r="21" fill="#f8f5ef" stroke="#25302d" stroke-width="1.7"/>
  <circle cx="960" cy="493" r="43" fill="none" stroke="#9da9a4" stroke-dasharray="3 6"/>
  <g transform="rotate(-12 1134 483)">
    <rect x="1107" y="465" width="54" height="36" fill="#435a55"/>
    <line x1="1119" y1="483" x2="1149" y2="483" stroke="#f8f5ef" stroke-width="1.5"/>
  </g>
  <path d="M1134 444C1088 417 1017 432 985 471" fill="none" stroke="#a05f48" stroke-width="2" marker-end="url(#copper-arrow)"/>
  <path d="M1104 489C1059 522 1017 521 984 506" fill="none" stroke="#435a55" stroke-width="1.3" stroke-dasharray="4 6"/>

  <line x1="72" y1="626" x2="1208" y2="626" stroke="#435a55" stroke-width="1.5"/>
  <text x="72" y="667" fill="#202724" font-family="Iowan Old Style, Baskerville, Palatino Linotype, Georgia, serif" font-size="20">The throughline</text>
  <text x="1208" y="666" fill="#435a55" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" text-anchor="end">Human evidence stays in the loop.</text>
</svg>
