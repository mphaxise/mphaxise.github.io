&lt;div id=&quot;minie-journey-prototype&quot;&gt;
  &lt;style&gt;

  &lt;div class=&quot;hm-meta&quot;&gt;
    &lt;span class=&quot;hm-section-label&quot;&gt;Expected story journey&lt;/span&gt;

      &lt;li class=&quot;hm-step&quot; data-stage=&quot;1&quot;&gt;&lt;span class=&quot;hm-step-mark&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;hm-step-name&quot;&gt;Express need&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;hm-step is-active&quot; data-stage=&quot;2&quot;&gt;&lt;span class=&quot;hm-step-mark&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;hm-step-name&quot;&gt;Find a match&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;hm-step&quot; data-stage=&quot;3&quot;&gt;&lt;span class=&quot;hm-step-mark&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;hm-step-name&quot;&gt;Confirm once&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;hm-step&quot; data-stage=&quot;4&quot;&gt;&lt;span class=&quot;hm-step-mark&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;hm-step-name&quot;&gt;Prepare &amp;amp; play&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;hm-step&quot; data-stage=&quot;5&quot;&gt;&lt;span class=&quot;hm-step-mark&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;hm-step-name&quot;&gt;Progress &amp;amp; control&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;hm-step&quot; data-stage=&quot;6&quot;&gt;&lt;span class=&quot;hm-step-mark&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;hm-step-name&quot;&gt;Complete &amp;amp; return&lt;/span&gt;&lt;/li&gt;

      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-pattern=&quot;playback&quot; aria-pressed=&quot;false&quot;&gt;Playback unknown&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-pattern=&quot;return&quot; aria-pressed=&quot;false&quot;&gt;Return state breaks&lt;/button&gt;

      &lt;h2 id=&quot;hm-pattern-title&quot;&gt;Constraint lost during retries&lt;/h2&gt;
      &lt;span class=&quot;hm-session&quot; id=&quot;hm-session&quot;&gt;Composite pattern A&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;hm-excerpts&quot; id=&quot;hm-excerpts&quot; aria-label=&quot;Conversation evidence&quot;&gt;&lt;/div&gt;

      &lt;section&gt;
        &lt;h3&gt;Observed&lt;/h3&gt;
        &lt;p id=&quot;hm-observed&quot;&gt;&lt;/p&gt;
      &lt;/section&gt;
      &lt;section&gt;
        &lt;h3&gt;Still unknown&lt;/h3&gt;

      &lt;/section&gt;
      &lt;section class=&quot;hm-opportunity&quot;&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;minie-journey-prototype&#x27;);
      if (!root) return;

      const patterns = {
        constraint: {
          title: &#x27;Constraint lost during retries&#x27;,
          session: &#x27;Composite pattern A&#x27;,
          stage: 2,
          stageLabel: &#x27;Find a match&#x27;,
          events: [
            { time: &#x27;Start&#x27;, label: &#x27;Requests a story in a preferred language&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Result 1&#x27;, label: &#x27;First story selected&#x27;, kind: &#x27;detour&#x27; },
            { time: &#x27;Retry&#x27;, label: &#x27;Repeats language constraint&#x27;, kind: &#x27;recovery&#x27; },
            { time: &#x27;Result 2&#x27;, label: &#x27;Second story starts&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Correction&#x27;, label: &#x27;Rejects the language mismatch&#x27;, kind: &#x27;detour&#x27; },
            { time: &#x27;Result 3&#x27;, label: &#x27;New play cue; outcome unknown&#x27;, kind: &#x27;unknown&#x27; }
          ],
          excerpts: [
            { role: &#x27;child&#x27;, meta: &#x27;Child · composite excerpt&#x27;, text: &#x27;“I asked for a story in my language.”&#x27; },
            { role: &#x27;child&#x27;, meta: &#x27;Child · composite excerpt&#x27;, text: &#x27;“No, not that one.”&#x27; },
            { role: &#x27;minie&#x27;, meta: &#x27;Minie · composite excerpt&#x27;, text: &#x27;“I found another story. Would you like to hear it?”&#x27; }
          ],
          observed: &#x27;Multiple selections and repeated language corrections; the final play cue has no confirmed progress.&#x27;,
          unknown: &#x27;The final audio language, audible delivery, and which subsystem caused the mismatch in the source cases.&#x27;,
          opportunity: &#x27;Persist language, topic, and rejected choices until a compatible story reaches confirmed playback.&#x27;
        },
        playback: {
          title: &#x27;Playback remains unverified after selection&#x27;,
          session: &#x27;Composite pattern B&#x27;,
          stage: 4,
          stageLabel: &#x27;Prepare &amp; play&#x27;,
          events: [
            { time: &#x27;Request&#x27;, label: &#x27;Asks for a story&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Select&#x27;, label: &#x27;Story selected&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Play&#x27;, label: &#x27;Play cue recorded&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Pause&#x27;, label: &#x27;No positive progress&#x27;, kind: &#x27;detour&#x27; },
            { time: &#x27;End&#x27;, label: &#x27;Story-ended event&#x27;, kind: &#x27;detour&#x27; },
            { time: &#x27;Next&#x27;, label: &#x27;Another cue; no checkpoint&#x27;, kind: &#x27;unknown&#x27; }
          ],
          excerpts: [
            { role: &#x27;child&#x27;, meta: &#x27;Child · composite excerpt&#x27;, text: &#x27;“Can you play a story?”&#x27; },
            { role: &#x27;minie&#x27;, meta: &#x27;Minie · composite excerpt&#x27;, text: &#x27;“I found one. Would you like to hear it?”&#x27; },
            { role: &#x27;system&#x27;, meta: &#x27;System · composite event sequence&#x27;, text: &#x27;Play requested → no confirmed progress → end recorded.&#x27; }
          ],
          observed: &#x27;The source pattern links selection, a play cue, no positive progress, and an end event; a later attempt is also unresolved.&#x27;,
          unknown: &#x27;Whether audio was audible, whether progress telemetry was missing, or whether the export joined incompatible events.&#x27;,
          opportunity: &#x27;Give every story attempt one instance ID and capture player-ready, first progress, pause, and end acknowledgements.&#x27;
        },
        return: {
          title: &#x27;Question round-trip loses return state&#x27;,
          session: &#x27;Composite pattern C&#x27;,
          stage: 5,
          stageLabel: &#x27;Progress &amp; control&#x27;,
          events: [
            { time: &#x27;Play&#x27;, label: &#x27;Story starts&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Question&#x27;, label: &#x27;Asks about the story&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Return 1&#x27;, label: &#x27;First return is linked&#x27;, kind: &#x27;recovery&#x27; },
            { time: &#x27;Progress&#x27;, label: &#x27;Playback advances&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Restart&#x27;, label: &#x27;Requests story restart&#x27;, kind: &#x27;normal&#x27; },
            { time: &#x27;Return 2&#x27;, label: &#x27;Different mode; audio return unknown&#x27;, kind: &#x27;unknown&#x27; }
          ],
          excerpts: [
            { role: &#x27;child&#x27;, meta: &#x27;Child · composite excerpt&#x27;, text: &#x27;“What is the story about?”&#x27; },
            { role: &#x27;minie&#x27;, meta: &#x27;Minie · composite excerpt&#x27;, text: &#x27;“It’s about two friends working together.”&#x27; },
            { role: &#x27;child&#x27;, meta: &#x27;Child · composite excerpt&#x27;, text: &#x27;“Okay, start the story again.”&#x27; }
          ],
          observed: &#x27;The first question is followed by linked continue/resume evidence and positive progress. A later restart request switches modes, and the corresponding audio-resume event is absent.&#x27;,
          unknown: &#x27;Whether the alternate narration used missing story state or whether story audio resumed outside the source export.&#x27;,
          opportunity: &#x27;Make question-and-return an explicit state machine that preserves story ID and position and requires a client return acknowledgement.&#x27;
        }
      };

      const title = root.querySelector(&#x27;#hm-pattern-title&#x27;);
      const session = root.querySelector(&#x27;#hm-session&#x27;);
      const divergence = root.querySelector(&#x27;#hm-divergence&#x27;);
      const events = root.querySelector(&#x27;#hm-events&#x27;);
      const excerpts = root.querySelector(&#x27;#hm-excerpts&#x27;);
      const observed = root.querySelector(&#x27;#hm-observed&#x27;);
      const unknown = root.querySelector(&#x27;#hm-unknown&#x27;);
      const opportunity = root.querySelector(&#x27;#hm-opportunity&#x27;);
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-pattern]&#x27;));
      const steps = Array.from(root.querySelectorAll(&#x27;[data-stage]&#x27;));

      const create = (tag, className, text) =&gt; {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const render = (key) =&gt; {
        const pattern = patterns[key];
        if (!pattern) return;

        title.textContent = pattern.title;
        session.textContent = pattern.session;
        divergence.textContent = `Diverges at stage ${pattern.stage} · ${pattern.stageLabel}`;
        observed.textContent = pattern.observed;
        unknown.textContent = pattern.unknown;
        opportunity.textContent = pattern.opportunity;

        buttons.forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.pattern === key));
        });

        steps.forEach((step) =&gt; {
          const active = Number(step.dataset.stage) === pattern.stage;
          step.classList.toggle(&#x27;is-active&#x27;, active);
          if (active) step.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
          else step.removeAttribute(&#x27;aria-current&#x27;);
        });

        events.replaceChildren();
        pattern.events.forEach((item) =&gt; {
          const li = create(&#x27;li&#x27;, &#x27;hm-event&#x27;);
          li.dataset.kind = item.kind;
          li.append(create(&#x27;span&#x27;, &#x27;hm-event-time&#x27;, item.time));
          li.append(create(&#x27;span&#x27;, &#x27;hm-event-label&#x27;, item.label));
          events.append(li);
        });
        events.setAttribute(&#x27;aria-label&#x27;, `${pattern.title}: observed journey for ${pattern.session}`);

        excerpts.replaceChildren();
        pattern.excerpts.forEach((item) =&gt; {
          const quote = create(&#x27;blockquote&#x27;, &#x27;hm-quote&#x27;);
          quote.dataset.role = item.role;
          quote.append(create(&#x27;span&#x27;, &#x27;hm-quote-meta&#x27;, item.meta));
          quote.append(create(&#x27;p&#x27;, &#x27;hm-quote-text&#x27;, item.text));
          if (item.translation) quote.append(create(&#x27;p&#x27;, &#x27;hm-translation&#x27;, item.translation));
          excerpts.append(quote);
        });
      };

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.pattern));
      });

      render(&#x27;constraint&#x27;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
