<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Model Slicer from release foundation to integrated debugging</title>
  <desc id="desc">Two timelines show Praneet Koppula's productization, dynamic-slicing, and cross-product workflow exploration alongside official MathWorks product milestones from R2015a through R2022a.</desc>
  <rect width="1200" height="720" rx="28" fill="#f6f0e3"/>
  <text x="64" y="66" fill="#527069" font-family="DM Mono, monospace" font-size="15" letter-spacing="2.2">MODEL SLICER PRODUCT ARC · 2014–2022</text>
  <text x="64" y="121" fill="#102823" font-family="Source Serif 4, Georgia, serif" font-size="43" font-weight="700">From release foundation to integrated debugging</text>
  <text x="64" y="157" fill="#527069" font-family="DM Sans, Arial, sans-serif" font-size="20">My design work and the public product record remain distinct evidence lanes.</text>

  <text x="64" y="231" fill="#9e3f1e" font-family="DM Mono, monospace" font-size="14" letter-spacing="1.5">MY WORK ACROSS THE PRODUCT ARC</text>
  <line x1="64" y1="274" x2="1136" y2="274" stroke="#f08a5d" stroke-width="5"/>
  <g font-family="DM Sans, Arial, sans-serif">
    <circle cx="184" cy="274" r="12" fill="#f08a5d"/>
    <text x="184" y="312" text-anchor="middle" fill="#9e3f1e" font-size="16" font-weight="700">2014</text>
    <text x="184" y="340" text-anchor="middle" fill="#102823" font-size="16">State-aware</text><text x="184" y="362" text-anchor="middle" fill="#102823" font-size="16">interaction design</text>
    <circle cx="438" cy="274" r="12" fill="#f08a5d"/>
    <text x="438" y="312" text-anchor="middle" fill="#9e3f1e" font-size="16" font-weight="700">2015</text>
    <text x="438" y="340" text-anchor="middle" fill="#102823" font-size="16">Dynamic-slicing</text><text x="438" y="362" text-anchor="middle" fill="#102823" font-size="16">workflow prototypes</text>
    <circle cx="850" cy="274" r="12" fill="#f08a5d"/>
    <text x="850" y="312" text-anchor="middle" fill="#9e3f1e" font-size="16" font-weight="700">Following releases</text>
    <text x="850" y="340" text-anchor="middle" fill="#102823" font-size="16">Cross-product verification</text><text x="850" y="362" text-anchor="middle" fill="#102823" font-size="16">workflow exploration</text>
  </g>

  <text x="64" y="446" fill="#173c36" font-family="DM Mono, monospace" font-size="14" letter-spacing="1.5">OFFICIAL MATHWORKS PRODUCT CONTEXT</text>
  <line x1="64" y1="490" x2="1136" y2="490" stroke="#173c36" stroke-width="5"/>
  <g font-family="DM Sans, Arial, sans-serif">
    <circle cx="184" cy="490" r="12" fill="#f9c74f" stroke="#173c36" stroke-width="3"/>
    <text x="184" y="530" text-anchor="middle" fill="#173c36" font-size="16" font-weight="700">R2015a</text>
    <text x="184" y="556" text-anchor="middle" fill="#527069" font-size="15">Model Slicer</text><text x="184" y="577" text-anchor="middle" fill="#527069" font-size="15">introduced</text>
    <circle cx="394" cy="490" r="12" fill="#f9c74f" stroke="#173c36" stroke-width="3"/>
    <text x="394" y="530" text-anchor="middle" fill="#173c36" font-size="16" font-weight="700">R2015b</text>
    <text x="394" y="556" text-anchor="middle" fill="#527069" font-size="15">Time-window</text><text x="394" y="577" text-anchor="middle" fill="#527069" font-size="15">API</text>
    <circle cx="682" cy="490" r="12" fill="#c7f0dc" stroke="#173c36" stroke-width="3"/>
    <text x="682" y="530" text-anchor="middle" fill="#173c36" font-size="16" font-weight="700">R2020b</text>
    <text x="682" y="556" text-anchor="middle" fill="#527069" font-size="15">Baseline-failure</text><text x="682" y="577" text-anchor="middle" fill="#527069" font-size="15">debugging</text>
    <circle cx="884" cy="490" r="12" fill="#c7f0dc" stroke="#173c36" stroke-width="3"/>
    <text x="884" y="530" text-anchor="middle" fill="#173c36" font-size="16" font-weight="700">R2021a</text>
    <text x="884" y="556" text-anchor="middle" fill="#527069" font-size="15">Verify-signal and</text><text x="884" y="577" text-anchor="middle" fill="#527069" font-size="15">MCDC inspection</text>
    <circle cx="1080" cy="490" r="12" fill="#c7f0dc" stroke="#173c36" stroke-width="3"/>
    <text x="1080" y="530" text-anchor="middle" fill="#173c36" font-size="16" font-weight="700">R2022a</text>
    <text x="1080" y="556" text-anchor="middle" fill="#527069" font-size="15">Equivalence and</text><text x="1080" y="577" text-anchor="middle" fill="#527069" font-size="15">objective inspection</text>
  </g>
  <rect x="64" y="636" width="1072" height="1" fill="#aebdb5"/>
  <text x="64" y="674" fill="#527069" font-family="DM Sans, Arial, sans-serif" font-size="16">Public milestones are team-owned releases. They do not map individual concepts one-to-one to shipped features.</text>
</svg>
