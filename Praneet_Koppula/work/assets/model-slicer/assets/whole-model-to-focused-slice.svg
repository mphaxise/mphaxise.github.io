<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From a large model to a focused slice</title>
  <desc id="desc">A public-safe explanatory diagram showing a complex model, a set of slicing criteria, and a reduced dependency slice for inspection.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102823" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#173c36"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f6f0e3"/>
  <text x="64" y="68" fill="#527069" font-family="DM Mono, monospace" font-size="15" letter-spacing="2.4">PUBLIC-SAFE REDRAW · 2014–2015</text>
  <text x="64" y="122" fill="#102823" font-family="Source Serif 4, Georgia, serif" font-size="43" font-weight="700">Make the relevant behavior visible</text>
  <text x="64" y="156" fill="#527069" font-family="DM Sans, Arial, sans-serif" font-size="20">Model Slicer narrows a large dependency network around explicit criteria.</text>

  <g transform="translate(64 224)" filter="url(#shadow)">
    <rect width="338" height="382" rx="22" fill="#fffdf7" stroke="#aebdb5"/>
    <text x="26" y="40" fill="#173c36" font-family="DM Mono, monospace" font-size="14" letter-spacing="1.8">01 · WHOLE MODEL</text>
    <g stroke="#9fb3aa" stroke-width="3" fill="none">
      <path d="M60 102H146L194 154H276"/><path d="M84 194H160L214 240H284"/><path d="M60 292H132L184 268H276"/><path d="M146 102V194"/><path d="M160 194V292"/><path d="M194 154L214 240"/>
    </g>
    <g fill="#e6ece7" stroke="#173c36" stroke-width="2">
      <rect x="34" y="80" width="80" height="44" rx="8"/><rect x="122" y="80" width="76" height="44" rx="8"/>
      <rect x="250" y="132" width="58" height="44" rx="8"/><rect x="50" y="172" width="68" height="44" rx="8"/>
      <rect x="136" y="172" width="68" height="44" rx="8"/><rect x="258" y="218" width="50" height="44" rx="8"/>
      <rect x="34" y="270" width="76" height="44" rx="8"/><rect x="126" y="270" width="72" height="44" rx="8"/>
      <rect x="250" y="246" width="58" height="44" rx="8"/>
    </g>
    <circle cx="170" cy="194" r="39" fill="none" stroke="#f08a5d" stroke-width="6"/>
    <text x="26" y="354" fill="#527069" font-family="DM Sans, Arial, sans-serif" font-size="17">Dependencies compete for attention.</text>
  </g>

  <path d="M430 415H500" stroke="#173c36" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(516 270)" filter="url(#shadow)">
    <rect width="216" height="288" rx="108" fill="#f9c74f" stroke="#173c36" stroke-width="2"/>
    <text x="108" y="58" text-anchor="middle" fill="#173c36" font-family="DM Mono, monospace" font-size="14" letter-spacing="1.5">02 · CRITERIA</text>
    <circle cx="108" cy="113" r="17" fill="#f08a5d" stroke="#173c36" stroke-width="2"/>
    <text x="108" y="151" text-anchor="middle" fill="#102823" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="700">Starting point</text>
    <path d="M52 183H164" stroke="#173c36" stroke-width="1" opacity=".35"/>
    <rect x="91" y="205" width="34" height="18" rx="4" fill="#fffdf7" stroke="#173c36" stroke-width="2"/>
    <text x="108" y="250" text-anchor="middle" fill="#102823" font-family="DM Sans, Arial, sans-serif" font-size="17">Exclusions</text>
  </g>

  <path d="M748 415H818" stroke="#173c36" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(834 224)" filter="url(#shadow)">
    <rect width="302" height="382" rx="22" fill="#173c36"/>
    <text x="26" y="40" fill="#c7f0dc" font-family="DM Mono, monospace" font-size="14" letter-spacing="1.8">03 · FOCUSED SLICE</text>
    <g stroke="#7bd8af" stroke-width="4" fill="none">
      <path d="M58 116H146L212 174"/><path d="M58 232H146L212 174"/><path d="M212 174V274"/>
    </g>
    <g fill="#f9c74f" stroke="#fffdf7" stroke-width="2">
      <rect x="30" y="94" width="88" height="44" rx="8"/><rect x="122" y="94" width="72" height="44" rx="8"/>
      <rect x="30" y="210" width="88" height="44" rx="8"/><rect x="124" y="210" width="70" height="44" rx="8"/>
      <rect x="198" y="152" width="70" height="44" rx="8"/><rect x="196" y="252" width="74" height="44" rx="8"/>
    </g>
    <text x="26" y="338" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="700">Inspect the dependency path.</text>
    <text x="26" y="363" fill="#b8cbc4" font-family="DM Sans, Arial, sans-serif" font-size="16">Explain, debug, or refine.</text>
  </g>
</svg>
